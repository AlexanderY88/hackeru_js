        // arrow function

      let findMin = (numbers = [1, 2, 3, -1, -2, 5]) => {
        let min = numbers[0];
        for (let num of numbers) {
          if (num < min) min = num;
        }
        return min;
      };

      let arr01 = [10, 5, 95, 20, 30, 50];
      let arr02 = [12, 10, 90, 30, 54];
      let arr03 = [6, 73, 50, 65, 47, 108, 6, 1];

      let uniteArs = (arr01, arr02, arr03) => {
        let arrUnited = [...arr01, ...arr02, ...arr03]; // spread operator to unite arrays 
        let result = [];
        let average = () => {
          let sum = 0;
          for (let index in arrUnited) {
            sum += arrUnited[index];
          }
          return sum / arrUnited.length;
        }
        console.log("average " + average());
        // filter numbers that are greater than the average
        for (index in arrUnited) {
          if (arrUnited[index] > average()) {
            result.push(arrUnited[index]); // push only numbers that are greater than the average
          }
        }
        return result;
      }

      console.log(uniteArs(arr01, arr02, arr03));


      // another way of the exercise
      let uniteArs2 = (arr01, arr02, arr03) => {
        let arr = [...arr01, ...arr02, ...arr03]; // spread operator to unite arrays 
        let sum = 0; 
        for (let i in arr) {
          sum += arr[i]; // calculate sum
        }
        let avg = sum / arr.length; // calculate average
        let result = [];
        for (let i in arr) {
          if (arr[i] > avg) {
            result.push(arr[i]); // push only numbers that are greater than the average
          }
        }
        return result;
      }

      class Student extends Human {
        constructor(id, name, course) {
          super(id, name); // call the parent constructor
          this.course = course;
        }

        getInfo() {
          super.getInfo(); // call the parent method
          console.log("Course: " + this.course);
        }

        get(propName) {
          return this.propName;
        }

        set(propName, value) {
          this.propName = value;
        }

      }

    // private variables in classes
    // in hebrew: משתנים פרטיים במחלקות

    class User {
      #password; // private variable, in hebrew: משתנה פרטי
      // in hebrew: משתנה פרטי הוא משתנה שאינו ניתן לגישה מחוץ למחלקה
      constructor(id, name, password) {
        this.id = id;
        this.name = name;
        this.#password = password;
      }

      getPassword(){
        return this.#password; // method to get private variable, in hebrew: שיטה לקבלת משתנה פרטי
      }
      // method to get user info
      getInfo() {
        console.log(`ID: ${this.id}, Name: ${this.name}`);
      }

      // method to check password
      checkPassword(password) {
        return this.#password === password;
      }
    }

    let u1 = new User(1, "Alice", "Abc123");
    u1.getInfo();
    console.log(u1.name); // Alice
    console.log(u1.id); // 1

    console.log(u1.getPassword()); // Abc123
    console.log(u1.checkPassword("Abc123")); // true
    console.log(u1.checkPassword("WrongPass")); // false
