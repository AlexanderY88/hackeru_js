        // explanation: create main function that calls the checkGrade function twice and prints the result
        // if the grade is above 54, it resolves with "Passed!", otherwise it rejects
function checkGrade(grade){
            return new Promise((resolve, reject) =>{
                if (grade>54)resolve("Passed!");
                else reject ("failed!");
            });
        }
        async  function mainFunc(){
          try {
              let result = await checkGrade(80);
        console.log(result);

        console.log( result2);

  }

//  TARGIL

let text = "Hello, world t!";
let text2 = "Hello, world!";
let letter = "t";
let letter2 = "z";

function checkLetter(text, letter) {
    return new Promise((resolve, reject) => {
        for (t in text) {
            if (t === letter) {
                resolve(`Yes. The letter "${letter}" is in the text.`);
            } else {
                reject(`No. The letter "${letter}" is not in the text.`);
            }
        }
    })
}

async  function mainFunc1() {
    try {
        let result = await checkLetter(text, letter);
        console.log(result);
    } catch (error) {
        console.log(error);
    }

    try {
        let result2 = await checkLetter(text2, letter2);
        console.log(result2);
    } catch (error) {
        console.log(error);
    }
}

mainFunc1();

</script>
