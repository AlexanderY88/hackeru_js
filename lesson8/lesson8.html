	<form action="">
		<input type="date">
		<button type="submit" class="btn btn-primary">Submit</button>
		<p id="result">result</p>
	</form>
	<script>
		let dateInput = document.querySelector('input[type="date"]');
		let result = document.getElementById("result");

		function dayOfDate(event) {
			event.preventDefault();
			let dateValue = dateInput.value;
			if (!dateValue) {
				result.textContent = "Please select a date.";
				return;
			}
			let date = new Date(dateValue);
			let day = date.getDay();
			let dayName;
			switch (day) {
				case 0:
					dayName = "Sunday";
					break;
				case 1:
					dayName = "Monday";
					break;
				case 2:
					dayName = "Tuesday";
					break;
				case 3:
					dayName = "Wednesday";
					break;
				case 4:
					dayName = "Thursday";
					break;
				case 5:
					dayName = "Friday";
					break;
				case 6:
					dayName = "Saturday";
					break;
				default:
					dayName = "Unknown";
			}
			result.textContent = "Day of week: " + dayName;
		}

		document.querySelector("form").addEventListener("submit", dayOfDate); // star function 			
		// explanation of a function: pick day by specific date and picks number of day. After this by the number send a text with specific day to client  
	</script>


	<form action="">
		<input type="date" id="date1">
		<button type="submit" class="btn btn-primary">Submit</button>
		<p id="result1">result</p>
	</form>

	<script>
		let days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
		function check2(event) {
			event.preventDefault();
			let dateInput2 = document.getElementById("date1");
			let result1 = document.getElementById("result1");
			let dateValue = dateInput2.value;
			if (!dateValue) {
				result1.innerText = "Please select a date.";
				return;
			}
			let date = new Date(dateValue);
			result1.innerText = days[date.getDay()];
		}
		document.querySelectorAll("form")[1].addEventListener("submit", check2); // print day on a screen
	

	</script>
	


</body>
