<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	

	<script>

		// סיפריה MATH
		console.log(Math.PI); // PI number
		console.log(Math.sqrt(81)); // square root
		console.log(Math.pow(2,3)); // like ** (power)
		console.log(Math.abs(-12)); // like * -1
		console.log(Math.round(3.6)); // round to the near number
    console.log(Math.round(2.5)); 
		console.log(Math.floor(2.9)); // cut numbers after root 
		console.log(Math.max(10, 100, 80, 70));  // max number
		console.log(Math.min(10, 20, 8, 99)); // min number
		console.log(Math.random()); // random number from 0 to 1 
		console.log(Math.ceil(2.4)); // returns 3, because 3 is the smallest integer greater than or equal to 2.4.	 
		console.log(); //  

		function randomNum() {
			num = Math.floor((Math.random() * 10 ));
			console.log("random number: "+ num);
		}
		randomNum(); // function that return random num

		console.log(Math.floor(Math.random()*10));



	</script>


</body>
