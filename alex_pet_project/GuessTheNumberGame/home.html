<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the number</title>
    <link rel="stylesheet" href="styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <h1 id="header_text">Welcome to the Guess the Number Game!</h1>
    <p id="explanation_text">Try to guess the number I'm thinking of between 1 and 10.</p>
    <p id="tryes_text">You have 5 treys left to guess the number</p>
    <div id="container">
        <div id="input_container">
            <label for="guessInput" id="guessInput">Enter your number:</label>
            <input type="number" id="guessInputField" min="1" max="10" required>
        </div>
        <p id="validation_message"></p>
        <div id="buttons">
            <button id="submitGuess" onclick="check_answer()">Check number</button>
            <button id="resetGame" onclick="reset_game()">Reset Game</button>
    </div>
</div>
    
    <div id="resultMessage"></div>
</body>
</html>
