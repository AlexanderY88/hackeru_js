<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Shopping List New</title>
</head>
<body>

    <h1 class="display-2 text-center">To do list</h1>
    <div class="container-sm w-50">
        <div class="items">
            <h2>Add item to the list</h2>
            <input type="text" id="itemInput" class="form-control" placeholder="Enter item name here" maxlength="50">
            <button class="btn btn-primary mt-3  " id="addItemButton" onclick="addItem()" style="width: 140px; height: 50px;">Add item to list</button>
            <button class="btn btn-primary mt-3  float-end" id="resetButton" onclick="resetList()" style="width: 140px; height: 50px;">Reset the list</button>
        </div>
        <div class="card mt-3 w-100 d-grid gap-2 d-md-block" style="width: 18rem;">
            <ul class="list-group list-group-flush" id="itemsList">
                <li class="list-group-item p-3 mb-2 bg-primary text-white">
                   <span id="itemHeader" class="fs-4 text " >Your List:</span>
                </li>
                <li class="list-group-item ">
                   <span id="itemName" class="fs-4 text" >Here will be your list </span>
                </li>
            </ul>
            <div class="card-footer">
                <span>Items in the list: <span id="itemsCount">0</span></span>
                <br>
                <span> To do: <span id="itemsToDo">0</span></span>
                <br>
                <span> Done: <span id="done">0</span></span>
            </div>
        </div>
    </div>
    
    <script>
        // array to store items in the list
        let itemsInList = [];

        // class to create the object 
        class Item {
            constructor(name) {
                this.number = itemsInList.length + 1;
                this.name = name || "default item";
                this.checked = false;
            }
        }

        // Function to add the items list to local storage
        let addItemListToLocalStorage = () => {
            localStorage.setItem("itemsInList", JSON.stringify(itemsInList));
        };

        // function load json from local storage
        let loadItemsFromLocalStorage = () => {
            let items = localStorage.getItem("itemsInList");
            for (item of JSON.parse(items)) {
                itemsInList.push(item);
            }
        };

        let showItems = () => {
            let itemsList = document.getElementById("itemsList");
            itemsList.innerHTML = ""; // clear the list
            // add header to the list 
            itemsList.innerHTML += `
                <li class="list-group-item p-3 mb-2 bg-primary text-white">
                   <span id="itemHeader" class="fs-4 text " >Your List:</span>
                </li>`;
            for (item of itemsInList) {
                let checked = item.checked ? "checked" : "";
                itemsList.innerHTML += `
                <li class="list-group-item " id="item-${item.number}">
                   <span id="itemName" class="fs-4 text" >${item.name}</span>
                   <div class="float-end">
                        <input type="checkbox" id="checked" name="checked" value="yes" onclick="checkBox(${item.number})" class="form-check-input m-2" style="height: 25px; width: 25px;" ${checked}>
                        <button class="btn btn-danger btn-sm float-end m-2" onclick="removeItem(${item.number})" style="height: 25px; width: 25px; padding: 0;"><i class="fas fa-times" ></i></button>
                   </div>
                </li>`
            }
        };

        // Function to add an item to the list
        let addItem = () => {
            let input = document.getElementById("itemInput");
            let itemName = input.value.trim();

            let newItem = new Item(itemName);
            itemsInList.push(newItem);
            addItemListToLocalStorage();
            showItems();
            updateItemCount();
        };

        // Function to remove an item from the list
        function removeItem(button) {
            let item = document.getElementById(`item-${button}`);
            itemsInList.splice(item, 1); // Remove from array
            showItems();
        };

        // Function to update the item count
        let updateItemCount = () => {
            let itemsCount = document.getElementById("itemsCount");
            let itemsToDo = document.getElementById("itemsToDo");
            let done = document.getElementById("done");

            itemsCount.innerText = itemsInList.length;
            itemsToDo.innerText = itemsInList.filter(item => !item.checked).length;
            done.innerText = itemsInList.filter(item => item.checked).length;
        };

        let checkBox = (itemNumber) => {
                let item = itemsInList.find(item => item.number === itemNumber);
                if (item.checked === true) {
                    item.checked = false;
                } else {
                    item.checked = true;
                }
                addItemListToLocalStorage();
                showItems();
                updateItemCount();
            };

        // Function to reset the list
        let resetList = () => {
            itemsInList = [];
            addItemListToLocalStorage();
            showItems();
            updateItemCount();
            document.getElementById("itemInput").value = ""; // Clear input field
             document.getElementById("itemsList").innerHTML = `
                <li class="list-group-item p-3 mb-2 bg-primary text-white">
                   <span id="itemHeader" class="fs-4 text " >Your List:</span>
                </li>
                <li class="list-group-item ">
                   <span id="itemName" class="fs-4 text" >Here will be your list </span>
                </li>`;
        };

    </script>




</body>
</html>
