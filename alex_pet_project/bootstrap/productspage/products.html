let products = [];

// Product constructor function
function Product(name, productName, category, img, serial_number, description, price, isAviable) {
    this.productName = productName
    this.name = name;
    this.category = category;
    this.img = img;
    this.serial_number = serial_number;
    this.description = description;
    this.price = price;
    this.isAviable = isAviable || true; // Default to true if not provided
    products.push(this); // Add product to the global products array

    this.getProductName = function() {
        return this.productName;
    };
    this.setProductName = function(productName) {
        this.productName = productName;
    };

    this.getName = function() {
        return this.name;
    };
    this.setName = function(name) {
        this.name = name;
    };

    this.getCategory = function() {
        return this.category;
    };
    this.setCategory = function(category) {
        this.category = category;
    };

    this.getImg = function() {
        return this.img;
    };
    this.setImg = function(img) {
        this.img = img;
    };

    this.getSerialNumber = function() {
        return this.serial_number;
    };
    this.setSerialNumber = function(serial_number) {
        this.serial_number = serial_number;
    };

    this.getDescription = function() {
        return this.description;
    };
    this.setDescription = function(description) {
        this.description = description;
    };

    this.getPrice = function() {
        return this.price;
    };
    this.setPrice = function(price) {
        this.price = price;
    };  

    this.getIsAviable = function() {
        return this.isAviable;
    };
    this.setIsAviable = function(isAviable) {
        this.isAviable = isAviable;
    };

}

// function to show the products in the HTML
function showProducts() {
    let productsContainer = document.getElementById("productsContainer");
    productsContainer.innerHTML = ""; // Clear the container
    for (let i in products) {
        let product = products[i];
        productsContainer.innerHTML += `
        <div class="card" style="width: 18rem;">
        <img src="${product.img}"" class="card-img-top" alt="image of ${product.name}">
        <div class="card-body">
            <h5 class="card-title">${product.name}</h5>
            <p class="card-text">${product.description}</p>
            <a href="#" class="btn btn-primary">More Details</a>
        </div>
        </div>
        `
    }
}
