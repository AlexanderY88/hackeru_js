<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">


    <title>Document</title>
</head>
<body>

    <div class="form-floating mb-3">
        <input type="name" class="form-control" id="floatingInput" placeholder="product name">
        <label for="floatingInput">Product name</label>
    </div>
    <div class="form-floating">
        <input type="number" class="form-control" id="number" placeholder="number">
        <label for="floatingPassword">Price</label>
    </div>
    <button id="addProductBtn" class="btn btn-primary m-3" onclick="addProduct()">Add Product</button>
    <p id="validationText"></p>
<br>
<hr>
    <div class="productsList">
        <ul class="list-group" id="list-group">
        </ul>
    </div>
    <script>

        let products = [];

        // Product constructor function
        function Product(id, name, price) {
            this.id = id;
            this.name = name;
            this.price = price;
            this.get = function(varName) {
                return this[varName];
            }
            this.set = function(varName, value) {
                this[varName] = value;
            }
            this.getInfo = function () {
                console.log(this.id, this.name, this.price);
            }
            function addToArray() {
                let products = [];
                products.push(this);
                return products;
            }
        }

        // let p = new Product(12, "Laptop", 3600);
        // console.log(p.get("name")); // "Laptop"
        // p.set("price", 4000);
        // console.log(p.get("price")); // 4000
        // p.set("price", 4500);
        // console.log(p.get("price")); // 4500
        // p.getInfo(); // 12 "Laptop" 4500

        product_1 = new Product(1, "Laptop", 3600);
        product_2 = new Product(2, "Monitor", 550);  
        product_3 = new Product(3, "keyboard", 300);

        products.push(product_1);
        products.push(product_2);
        products.push(product_3);

        function showProducts() {
            document.getElementById("list-group").innerHTML = ""; // Clear the list
            for(let i in products) {
                let product = products[i];
                document.getElementById("list-group").innerHTML += `
                    <li class="list-group-item"> The product namr: ${product.get("name")}, product price: ${product.get("price")}
                        <button class="btn btn-primary m-3" onclick="removeProduct(${product.get("id")})">
                            Remove from list
                        </button>
                    </li> 
                    ` }
                localStorage.setItem("products", JSON.stringify(products)); // Save to localStorage
           }


        // Call the function to display products
        showProducts();

        function addProduct() {
            let productName = document.getElementById("floatingInput").value;
            let productPrice = document.getElementById("number").value;
            if (!productName || !productPrice) {
                document.getElementById("validationText").innerText = "Please enter both product name and price";
                return;
            }
            let productId = products.length + 1; // Simple ID generation based on current length
            let newProduct = new Product(productId, productName, productPrice);
            products.push(newProduct);
            showProducts(); // Refresh the product list
            
        }

        function removeProduct(id) {
            products = products.filter(product => product.get("id") !== id);
            document.getElementById("list-group").innerHTML = ""; // Clear the list
            showProducts(); // Refresh the product list
            localStorage.setItem("products", JSON.stringify(products)); // Save to localStorage
        }

    </script>
    
</body>
</html>
