<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">


    
    <title>Homework Promise</title>
</head>
<body>
    
    
    <div class="container mt-3">
        <div class="row justify-content-center align-items-center min-vh-10 mb-4">
            <div class="card main-card shadow-lg border-0 align-items-center w-75">
                <h1 class="text-center">First exercise</h1>
                <input type="text" id="inputField" placeholder="Type your text here" class="form-control w-50 m-2 mt-4">
                <p id="result" class="height: 20px;">Here will be result</p>
                <button id="checkLength" onclick="checkInputLength()" class="btn btn-primary m-2 w-50 mb-5">Check length</button>
                   
            </div>
        </div>
    </div>
    <script>
        let checkInputLength = () => {
            let inputField = document.getElementById("inputField");
            let result = document.getElementById("result");
            // new promise 
            let check = new Promise((res, rej) => {
                if (inputField.value.length % 2 === 0) {
                    res("<span>Yes. The number of characters is even");
                }
                else {
                    rej("No. The number of characters is odd");
                }
            });

            check.then((message) => {
                result.innerHTML = `<span>${message}</span>`;
            }).catch((error) => {result.innerHTML = `<span>${error}</span>`});
        };



    </script>


    <hr>
    

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-10">
            <div class="card main-card shadow-lg border-0 align-items-center w-75">
                <h1 class="text-center mt-3 mb-4">Second exercise</h1>
                <p id="number" class="height: 20px; mt-3">Here will be result</p>
                <button id="myButton" class="btn btn-primary m-2 w-50 mb-5" onclick="createTheNumber()">Click me</button>
            </div>
        </div>


<script>
let number = document.getElementById("number");
let createTheNumber = () => {
    number.innerHTML = "Loading...";
    let promise = new Promise((resolve, reject) => {
        setTimeout(() => {
        let num = Math.random();
        if (num > 0.5) {
            resolve("The number is greater than 0.5: " + num);
        }
        else {
            reject("The number is less than or equal to 0.5: " + num);
        }
        }, 2000);
    });


promise.then((result) => {
number.innerHTML = `<span>${result}</span>`;
}).catch((error) => {
    number.innerHTML = `<span>${error}</span>`;
});

};







</script>

<!-- bootstrap js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
