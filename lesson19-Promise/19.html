const secret = (num) => {
    return new Promise((resolve, reject) => {
        if (num % 2 === 0) {
            resolve(num + " is even!");
        } else {
            reject(num + " is odd!");
        }
    });
};

// .catch = error value when resolve not true 
secret(10)
.then((result) => console.log(result))
.catch((error) => console.log(error));

// console.log("Promise all - end");

let water = false, tomato = false;

let pasta2 = new Promise((res, rej) => {
    if (water) {
        setTimeout(() => {
            res("Pasta is ready");
        }, 2000);
    } else {
        rej("No water for pasta");
    }
});
let souse2 = new Promise((res, rej) => {
    if (tomato) {
        setTimeout(() => {
            res("Souse is ready");
        }, 3000);
    } else {
        rej("No tomato for souse");
    }
}); 
// Promise.all - waits for all promises to resolve
Promise.all([pasta2, souse2])
.then((messages) => {
    console.log(messages[0]);
    console.log(messages[1]);
})
.catch((error) => {
    console.log(error);
});
// if one of the promises is rejected, the catch will be executed for all promises. Only if all promises are resolved, the then will be executed
