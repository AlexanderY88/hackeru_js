	<script>
		function power(num1, num2) {
			let result = num1**num2;
			return result;
		}
		console.log(power(5, 5));

		function stars(num) {
			let result = "";
			for (let i = 0; i<=num; i++) {
				result += "*";
			}
			return result;
		}
		console.log(stars(5));

		function printNumbers(num1, num2) {
			if (num1 > num2) {
				console.log("The first number must be less than or equal to the second number.");
				return;
			} 
			else if (num1 === num2) {
				console.log("The numbers are equal.");
				return;
			}
			else {
				for (let i = num1; i <= num2; i++) {
					console.log(i);
				}
			}
		}
		printNumbers(5, 10);
		printNumbers(10, 5);
		printNumbers(5, 5);

		function averageNumbers(num1, num2, num3) {
			return (num1 + num2 + num3) / 3;
		}
		console.log(averageNumbers(7, 64, 5).toFixed(3));

		// long way
		function find_t(str) {
			let bool = false;
			for (i=0; i< str.length; i++) {
				if (str[i] === "t" || str[i] === "T") {
					bool = true
				}
			}
			return bool;
		}
		console.log(find_t("teriyaki"));

		//another way
		function find_t_2(str) {
			for ( i = 0; i < str.length; i++ ) {
				if ( str[i] === "t" || str[i] === "T" ) {
					return true;
				}
			}
		return false
	}

	console.log(find_t_2("moses"));
	console.log(find_t_2("teriyaki"));
	console.log(find_t_2("moses"));

	//short way
	function search_t_short(str) {
		 return str.includes("t") || str.includes("T");
	}
	console.log(search_t_short("Alex"));
	console.log(search_t_short("Atlex"));
	

	function modulo(num1, num2) {
		if (num1 % 3 === 0 && num2 % 3 === 0) return true;
		return false;
	}
	console.log("modulo funct");
	console.log(modulo(3,6));
	console.log(modulo(2, 9));
	console.log(modulo(3, 8));
	console.log(modulo(4, 8));

	console.log("Check numbers");
	function checkNumbers(numbers) {
			for (let i = 0; i < numbers.length-1; i++) {
				if (numbers[i] >= numbers[i + 1]) return false;
			}
			return true;
		}

	console.log(checkNumbers([1,2,3,4,5,6]));
	console.log(checkNumbers([1, 2, 3, 3, 5, 6]));
	


	console.log("array average");
	function arr_avg(arr) {
		let num = 0;
		for (i = 0; i < arr.length; i++) {
			num += arr[i]
		}
		return num / arr.length;
	}

	console.log(arr_avg([5,10,15]));

	console.log("unshift()")
	function reverse_arr(arr) {
		let array = [arr[0]];
		for (i = 1; i < arr.length; i++) array.unshift(arr[i]);
		return array;
	}

	// another way
	function reverse_arr1(arr) {
			let array = [];
			for (let i = arr.length-1; i >= 0; i--) 
				{
					array.push(arr[i]); 
				}
			return array;
		}
